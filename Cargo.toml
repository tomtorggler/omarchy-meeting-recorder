[package]
name = "omarchy-meeting-recorder"
version = "1.8.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml_edit = "0.25.15"
ort = "2.0.0-rc.13"
realfft = "3"
ureq = "3.4.2"
url = "2.2"
whisper-rs = "0.16"

[features]
default = ["vulkan"]
# GPU transcription through whisper.cpp's Vulkan backend. Needs the Vulkan
# headers (`vulkan-headers` on Arch) and glslc (`shaderc`) to build.
vulkan = ["whisper-rs/vulkan"]

# Local only: whisper.cpp aborts in the DTW median filter on a very short
# decode window; this copy skips DTW there. Not for upstream.
[patch.crates-io]
whisper-rs-sys = { path = "../whisper-rs-sys-dtw-fix" }
